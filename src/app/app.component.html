<!-- BANNER MODO OFFLINE -->
@if (isOffline) {
  <div class="bg-orange-600/90 text-white text-[10px] font-black uppercase tracking-widest text-center py-2 fixed top-0 w-full z-50 backdrop-blur-sm shadow-lg transition-all">
    Sin conexión. Tus cambios se guardarán localmente. ⚡
  </div>
}

<div class="bg-zinc-950 min-h-screen text-white flex flex-col font-sans relative pb-20">
  
  <main class="flex-1 w-full max-w-md mx-auto p-4">
    <router-outlet></router-outlet>
  </main>

  @if (modalAbierto) {
    <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 transition-opacity" (click)="cerrarModal()"></div>
  }

  <div 
    class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-zinc-900 border-t border-zinc-800 rounded-t-[32px] p-6 z-50 transition-transform duration-300 ease-out transform max-h-[85vh] overflow-y-auto flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.5)] [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]"
    [class.translate-y-full]="!modalAbierto"
    [class.translate-y-0]="modalAbierto">
    
    <div class="w-12 h-1.5 bg-zinc-700 rounded-full mx-auto mb-6 shrink-0"></div>
    <h3 class="text-2xl font-black text-white mb-4 shrink-0 uppercase tracking-tight">Estructurar Rutina</h3>
    
    <div class="flex flex-col gap-4">
      <input type="text" [(ngModel)]="nuevaRutina.nombre" placeholder="Nombre de la Rutina (Ej. PUSH DAY)" class="bg-zinc-800/80 border border-zinc-700 rounded-2xl p-4 text-white font-bold focus:outline-none focus:border-cyan-500 uppercase transition-colors">
      
      <select [(ngModel)]="nuevaRutina.dia" class="w-full bg-zinc-800/80 border border-zinc-700 rounded-2xl p-4 text-white font-bold focus:outline-none focus:border-cyan-500 transition-colors cursor-pointer">
        <option value="Lunes">Lunes</option>
        <option value="Martes">Martes</option>
        <option value="Miércoles">Miércoles</option>
        <option value="Jueves">Jueves</option>
        <option value="Viernes">Viernes</option>
        <option value="Sábado">Sábado</option>
        <option value="Domingo">Domingo</option>
      </select>

      <div class="mt-4 bg-zinc-950/50 p-4 rounded-3xl border border-zinc-800">
        <div class="flex justify-between items-center mb-4">
          <h4 class="text-xs font-bold text-zinc-400 uppercase tracking-widest">Lista de Ejercicios</h4>
          <button (click)="agregarEjercicio()" class="text-cyan-400 text-xs font-black bg-cyan-500/10 px-3 py-1.5 rounded-lg hover:bg-cyan-500/20 transition-colors border border-cyan-500/20">
            + AÑADIR
          </button>
        </div>

        <div class="flex flex-col gap-3">
          @for (ejercicio of nuevaRutina.ejerciciosLista; track $index) {
            <div class="bg-zinc-800 p-4 rounded-2xl border border-zinc-700 relative">
              <button (click)="eliminarEjercicio($index)" class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-black shadow-lg hover:scale-110 transition-transform">✕</button>
              
              <input type="text" [(ngModel)]="ejercicio.nombre" placeholder="Nombre (Ej. Press de Banca)" class="w-full bg-transparent text-white font-bold mb-3 focus:outline-none placeholder:text-zinc-500 text-sm">
              
              <div class="flex gap-3 mb-3">
                <select [(ngModel)]="ejercicio.musculoAsignado" class="w-full bg-zinc-900 border border-zinc-700/50 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-cyan-500 cursor-pointer">
                  <option value="" disabled selected>¿Qué músculo trabaja?</option>
                  @for (m of opcionesMusculos; track $index) {
                    <option [value]="m">{{ m }}</option>
                  }
                </select>
              </div>

              <div class="flex gap-3">
                <div class="flex-1 flex items-center bg-zinc-900 rounded-xl p-2 border border-zinc-700/50">
                  <span class="text-[10px] text-zinc-500 font-bold ml-1 mr-2 tracking-widest">SETS</span>
                  <input type="number" min="1" [(ngModel)]="ejercicio.sets" class="w-full bg-transparent text-white text-center font-bold focus:outline-none">
                </div>
                <div class="flex-1 flex items-center bg-zinc-900 rounded-xl p-2 border border-zinc-700/50">
                  <span class="text-[10px] text-zinc-500 font-bold ml-1 mr-2 tracking-widest">REPS</span>
                  <input type="number" min="1" [(ngModel)]="ejercicio.reps" class="w-full bg-transparent text-white text-center font-bold focus:outline-none">
                </div>
              </div>
            </div>
          }
        </div>
      </div>

      @if (mensajeError) {
        <div class="bg-red-500/10 border border-red-500/50 text-red-400 text-xs font-bold p-4 rounded-2xl text-center shadow-[0_0_15px_rgba(239,68,68,0.1)] mt-2">
          {{ mensajeError }}
        </div>
      }

      <button (click)="guardarRutina()" class="w-full bg-cyan-400 text-black font-extrabold text-lg py-4 rounded-2xl mt-2 hover:bg-cyan-300 transition-colors shadow-[0_0_20px_rgba(34,211,238,0.4)]">
        Guardar Rutina
      </button>
    </div>
  </div>

  @if (!esRutaLogin) {
    <nav class="fixed bottom-0 w-full bg-zinc-900/90 backdrop-blur-md border-t border-zinc-800 pb-safe pt-2 px-6 z-30">
      <div class="max-w-md mx-auto flex justify-between items-center text-zinc-500">
        
        <a routerLink="/dashboard" class="flex flex-col items-center hover:text-white transition-colors cursor-pointer" routerLinkActive="text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>
        </a>

        <a routerLink="/comunidad" class="flex flex-col items-center hover:text-white transition-colors cursor-pointer" routerLinkActive="text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        </a>
        
        <a (click)="abrirModal()" class="flex flex-col items-center justify-center bg-cyan-400 text-black w-14 h-14 rounded-full -mt-8 shadow-[0_0_15px_rgba(34,211,238,0.4)] hover:scale-105 active:scale-95 transition-transform cursor-pointer border-[4px] border-zinc-900">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
        </a>

        <a routerLink="/progreso" class="flex flex-col items-center hover:text-white transition-colors cursor-pointer" routerLinkActive="text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
        </a>

        <a routerLink="/perfil" class="flex flex-col items-center hover:text-white transition-colors cursor-pointer" routerLinkActive="text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </a>

      </div>
    </nav>
  }
</div>
