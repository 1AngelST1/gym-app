<!-- Contenedor principal: Ocupa toda la pantalla, fondo oscuro y texto blanco -->
<div class="bg-zinc-950 min-h-screen text-white flex flex-col font-sans relative pb-20">
  
  <!-- Aquí adentro cambiarán las pantallas (Dashboard, Rutinas, Perfil) -->
  <main class="flex-1 w-full max-w-md mx-auto p-4">
    <!-- El router-outlet es el "hueco" donde Angular inyectará las otras vistas -->
    <router-outlet></router-outlet>
  </main>

  <!-- ========================================== -->
  <!-- MODAL DE CREACIÓN (Animación desde abajo)  -->
  <!-- ========================================== -->

  <!-- 1. Fondo oscuro desenfocado (Solo aparece si modalAbierto es true) -->
  @if (modalAbierto) {
    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 transition-opacity" (click)="cerrarModal()"></div>
  }

  <!-- 2. Tarjeta del Modal (Siempre existe, pero se esconde abajo con translate-y-full) -->
  <div 
    class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-zinc-900 border-t border-zinc-800 rounded-t-[32px] p-6 z-50 transition-transform duration-300 ease-out transform"
    [class.translate-y-full]="!modalAbierto"
    [class.translate-y-0]="modalAbierto">

    <!-- Pill decorativo superior (estilo iPhone) -->
    <div class="w-12 h-1.5 bg-zinc-700 rounded-full mx-auto mb-6"></div>

    <h3 class="text-2xl font-bold text-white mb-6">Nueva Rutina</h3>

    <!-- Formulario -->
    <div class="flex flex-col gap-4">
      <input type="text" [(ngModel)]="nuevaRutina.nombre" placeholder="Nombre (ej. ESPALDA)" class="bg-zinc-800/80 border border-zinc-700 rounded-2xl p-4 text-white font-bold focus:outline-none focus:border-zinc-500 uppercase transition-colors">
      
      <select [(ngModel)]="nuevaRutina.dia" class="bg-zinc-800/80 border border-zinc-700 rounded-2xl p-4 text-white font-bold focus:outline-none focus:border-zinc-500 transition-colors cursor-pointer">
        <option value="Lunes">Lunes</option>
        <option value="Martes">Martes</option>
        <option value="Miércoles">Miércoles</option>
        <option value="Jueves">Jueves</option>
        <option value="Viernes">Viernes</option>
        <option value="Sábado">Sábado</option>
        <option value="Domingo">Domingo</option>
      </select>
      
      <div class="grid grid-cols-2 gap-4">
        <input type="number" [(ngModel)]="nuevaRutina.duracion" placeholder="Minutos" class="bg-zinc-800/80 border border-zinc-700 rounded-2xl p-4 text-white font-bold focus:outline-none focus:border-zinc-500 transition-colors">
        <input type="number" [(ngModel)]="nuevaRutina.ejercicios" placeholder="Ejercicios" class="bg-zinc-800/80 border border-zinc-700 rounded-2xl p-4 text-white font-bold focus:outline-none focus:border-zinc-500 transition-colors">
      </div>

      <!-- Botón de Guardar -->
      <button (click)="guardarRutina()" class="w-full bg-white text-black font-extrabold text-lg py-4 rounded-2xl mt-4 hover:bg-zinc-200 transition-colors shadow-[0_0_20px_rgba(255,255,255,0.2)]">
        Crear Rutina
      </button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- BARRA DE NAVEGACIÓN INFERIOR ÚNICA         -->
  <!-- ========================================== -->
  <nav class="fixed bottom-0 w-full bg-zinc-900/90 backdrop-blur-md border-t border-zinc-800 pb-safe pt-2 px-6 z-30">
    <div class="max-w-md mx-auto flex justify-between items-center text-zinc-500">
      
      <!-- Inicio -->
      <a routerLink="/" class="flex flex-col items-center hover:text-white transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>
      </a>

      <!-- Comunidad -->
      <a class="flex flex-col items-center hover:text-white transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
      </a>

      <!-- BOTÓN PLUS (+) CON EVENTO (click) -->
      <a (click)="abrirModal()" class="flex flex-col items-center justify-center bg-white text-black w-14 h-14 rounded-full -mt-8 shadow-lg hover:scale-105 active:scale-95 transition-transform cursor-pointer border-[4px] border-zinc-900">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
      </a>

      <!-- Progreso -->
      <a routerLink="/progreso" class="flex flex-col items-center hover:text-white transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
      </a>

      <!-- Perfil -->
      <a routerLink="/perfil" class="flex flex-col items-center hover:text-white transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      </a>

    </div>
  </nav>

</div>
