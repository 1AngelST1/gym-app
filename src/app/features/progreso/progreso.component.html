<!-- Contenedor principal de progreso -->
<div class="flex flex-col gap-6 pt-8 pb-24">
  
  <!-- Encabezado -->
  <div class="flex justify-between items-end">
    <h2 class="text-2xl font-bold">Tu Progreso</h2>
    <select class="bg-transparent text-zinc-400 text-sm font-medium focus:outline-none cursor-pointer">
      <option value="mes">Este mes</option>
      <option value="semana">Esta semana</option>
      <option value="ano">Este año</option>
    </select>
  </div>

  <!-- Gráfica de Actividad (Simulada con Tailwind) -->
  <div class="bg-zinc-900 rounded-3xl p-6 border border-zinc-800 shadow-lg">
    <h3 class="text-sm font-bold text-zinc-500 uppercase tracking-wider mb-6">Volumen total (kg)</h3>
    
    <!-- Barras -->
    <div class="h-32 flex items-end justify-between gap-2">
      <div class="w-full bg-zinc-800 hover:bg-zinc-700 transition-colors rounded-t-md h-[40%] cursor-pointer"></div>
      <div class="w-full bg-zinc-800 hover:bg-zinc-700 transition-colors rounded-t-md h-[60%] cursor-pointer"></div>
      <div class="w-full bg-zinc-800 hover:bg-zinc-700 transition-colors rounded-t-md h-[30%] cursor-pointer"></div>
      
      <!-- Día actual destacado en blanco -->
      <div class="w-full bg-white rounded-t-md h-[80%] relative cursor-pointer group">
         <!-- Tooltip (globo de texto) que aparece al pasar el cursor -->
         <div class="absolute -top-8 left-1/2 -translate-x-1/2 text-xs font-bold bg-white text-black px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
           12.5k
         </div>
      </div>
      
      <div class="w-full bg-zinc-800 hover:bg-zinc-700 transition-colors rounded-t-md h-[50%] cursor-pointer"></div>
      <div class="w-full bg-zinc-800 hover:bg-zinc-700 transition-colors rounded-t-md h-[70%] cursor-pointer"></div>
      <div class="w-full bg-zinc-800 hover:bg-zinc-700 transition-colors rounded-t-md h-[20%] cursor-pointer"></div>
    </div>
    
    <!-- Días de la semana -->
    <div class="flex justify-between mt-3 text-xs text-zinc-500 font-bold px-1">
      <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- MAPA MUSCULAR GAMIFICADO                   -->
  <!-- ========================================== -->
  <div class="bg-zinc-900 rounded-3xl p-6 border border-zinc-800 shadow-lg mt-2">
    <div class="flex justify-between items-center mb-2">
      <h3 class="text-sm font-bold text-zinc-500 uppercase tracking-wider">Desarrollo Muscular</h3>
      <span class="text-xs font-bold bg-cyan-500/10 text-cyan-400 px-3 py-1 rounded-full border border-cyan-500/30 shadow-[0_0_10px_rgba(34,211,238,0.2)]">
        Nivel: Avanzado
      </span>
    </div>

    <div class="relative w-full flex justify-center py-6">
      <!-- Figura SVG Geométrica del Cuerpo -->
      <!-- Usamos drop-shadow y colores de Tailwind para los niveles -->
      <svg viewBox="0 0 100 200" class="w-48 h-auto drop-shadow-2xl">
          
          <!-- Cabeza (Siempre base) -->
          <circle cx="50" cy="20" r="14" class="fill-zinc-800 stroke-zinc-700 stroke-1" />
          
          <!-- Pecho -->
          <path d="M 28 42 L 72 42 L 78 68 L 50 78 L 22 68 Z" 
                [class]="obtenerClasesMusculo(niveles.pecho)" />
          
          <!-- Abdomen -->
          <path d="M 33 72 L 67 72 L 62 110 L 38 110 Z" 
                [class]="obtenerClasesMusculo(niveles.abdomen)" />
          
          <!-- Brazo Izquierdo -->
          <path d="M 23 45 L 8 95 L 16 100 L 30 70 Z" 
                [class]="obtenerClasesMusculo(niveles.brazoIzq)" />
          
          <!-- Brazo Derecho -->
          <path d="M 77 45 L 92 95 L 84 100 L 70 70 Z" 
                [class]="obtenerClasesMusculo(niveles.brazoDer)" />
          
          <!-- Piernas -->
          <path d="M 38 115 L 62 115 L 68 190 L 55 190 L 50 145 L 45 190 L 32 190 Z" 
                [class]="obtenerClasesMusculo(niveles.piernas)" />
      </svg>

      <!-- Leyenda de Niveles flotante a la derecha -->
      <div class="absolute right-0 top-1/2 -translate-y-1/2 flex flex-col gap-3 bg-zinc-950/50 p-3 rounded-2xl backdrop-blur-sm border border-zinc-800/50">
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.8)]"></div>
          <span class="text-[10px] text-zinc-300 font-bold uppercase">Diamante</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 rounded-full bg-yellow-500 shadow-[0_0_8px_rgba(234,179,8,0.5)]"></div>
          <span class="text-[10px] text-zinc-300 font-bold uppercase">Oro</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 rounded-full bg-zinc-300"></div>
          <span class="text-[10px] text-zinc-300 font-bold uppercase">Plata</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 rounded-full bg-orange-700"></div>
          <span class="text-[10px] text-zinc-300 font-bold uppercase">Cobre</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Historial reciente -->
  <div class="flex flex-col gap-4 mt-2">
    <h3 class="text-xl font-bold">Historial reciente</h3>
    
    <!-- Entrenamiento 1 -->
    <div class="bg-zinc-900/50 p-4 rounded-2xl border border-zinc-800 flex items-center justify-between hover:bg-zinc-800/80 transition-colors cursor-pointer">
      <div class="flex items-center gap-4">
        <!-- Ícono -->
        <div class="w-12 h-12 bg-zinc-800 rounded-xl flex items-center justify-center text-xl border border-zinc-700">
          💪
        </div>
        <div>
          <p class="font-bold text-white text-lg">Empuje</p>
          <p class="text-sm text-zinc-500">Ayer · 92 min</p>
        </div>
      </div>
      <div class="text-right">
        <p class="font-bold text-zinc-300">8,450</p>
        <p class="text-xs text-zinc-500">kg total</p>
      </div>
    </div>

    <!-- Entrenamiento 2 -->
    <div class="bg-zinc-900/50 p-4 rounded-2xl border border-zinc-800 flex items-center justify-between hover:bg-zinc-800/80 transition-colors cursor-pointer">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-zinc-800 rounded-xl flex items-center justify-center text-xl border border-zinc-700">
          🦵
        </div>
        <div>
          <p class="font-bold text-white text-lg">Pierna</p>
          <p class="text-sm text-zinc-500">Hace 3 días · 105 min</p>
        </div>
      </div>
      <div class="text-right">
        <p class="font-bold text-zinc-300">12,100</p>
        <p class="text-xs text-zinc-500">kg total</p>
      </div>
    </div>
  </div>

</div>
